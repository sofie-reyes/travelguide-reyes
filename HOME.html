<html>
<head>
    <title>HOME</title>
    <style>
        h1 {
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: white;
            text-align: center;
            font-size: 50px;
            margin-bottom:  10px;
        }
        p {
            font-family: georgia;
            font-style: bold;
            font-size: 24px;
            color: white;
            margin-bottom: 10px;
            text-align: justify;
        }
  .menu a {

            display:inline-block;
            background-color:#4c4d64;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s ease, color 0.3s ease;
        }

        .menu a:hover {
            background-color: #2E3A4D;
            color: white;
            transform: translateY(-5px); 
            box-shadow: 0 0 10px #2b2053, 
                        0 0 25px rgb(40, 23, 133); 
            transition: 0.3s ease
        }

        .menu-item { 
            position: relative; 
        } 

 body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    
    }
    body {
      background-image: url(paper.jpg);
    }

    .hero-banner {
      /* Adds a dark overlay on top of your background image */
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 17, 65, 0.5)), url('map2.jpg');
      height: 400px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      
      /* Centers the text inside the banner */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 0 20px;
    }

    .hero-banner h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .hero-banner p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .hero-btn {
      background-color: #007BFF;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .hero-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <header class="hero-banner">
    <h1>Mabuhay!</h1>
    <p>This is the Philippine Travel Guide: 
    "Where Every Island Tells a Story"
    </p>
  </header>

        </div>

    </nav>
    </center>
</body>
</html>
